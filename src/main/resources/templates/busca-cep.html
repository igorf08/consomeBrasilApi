<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header('Busca de CEP')}">

</head>
<header>
    <div th:replace="~{layout :: navbar}"></div>
</header>
<body class="bg-slate-900 text-zinc-300 min-h-screen font-sans">
    <main class="w-full max-w-2xl mx-auto flex flex-col justify-center px-4" style="min-height: calc(100vh - 80px);">
        <h2 class="text-3xl font-bold text-white mb-8">Consulta de CEP</h2>
        <form action="/consulta-cep/buscar" method="get" id="cepForm" class="bg-slate-800 p-6 rounded-2xl border border-slate-700 shadow-sm flex-col md:flex-row">

            <div class="mb-4">
                <label for="cep" class="block text-sm font-medium text-slate-400 mb-2">Digite o CEP:</label>
                <input type="text" id="cep" name="cep" placeholder="Ex: 60000-000" required
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors w-full md:w-auto"/>
            </div>

            <div class="flex justify-between items-center">
                <button type="submit"
                        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg px-4 py-3 transition-colors shadow-lg shadow-indigo-500/30 w-full md:w-auto">
                    Pesquisar
                </button>
                <div class="flex items-center self-end">
                    <input id="default-checkbox" type="checkbox" value="true" name="detalhada" class="w-4 h-4 border border-default-medium rounded-xs bg-neutral-secondary-medium focus:ring-2 focus:ring-brand-soft">
                    <label for="default-checkbox" class="select-none block text-sm font-medium text-slate-400 ml-1">Pesquisa detalhada</label>
                </div>
            </div>
        </form>

        <p class="m-2 text-red-600" th:if="${erro}" th:text="${erro}"></p>

        <div class="mt-8 bg-slate-950 border border-slate-800 p-6 rounded-xl shadow-2xl font-mono text-sm backdrop-blur-md overflow-x-auto overflow-y-hidden" th:if="${resultadoCep}">
            <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500/80"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500/80"></div>
                </div>
                <span class="text-slate-500 text-xs font-semibold tracking-wider">RESPONSE - 200 OK</span>
            </div>

            <div class="text-slate-300 leading-relaxed">
                <span class="text-slate-500">{</span>
                <div class="ml-6">
                    <div><span class="text-cyan-400">"cep"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.cepFormatado}"></span>"</span><span class="text-slate-500">,</span></div>
                    <div><span class="text-cyan-400">"rua"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.street}"></span>"</span><span class="text-slate-500">,</span></div>
                    <div><span class="text-cyan-400">"bairro"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.neighborhood}"></span>"</span><span class="text-slate-500">,</span></div>
                    <div><span class="text-cyan-400">"cidade"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.city}"></span>"</span><span class="text-slate-500">,</span></div>
                    <div><span class="text-cyan-400">"estado"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.state}"></span>"</span></div>
                    <div th:if="${detalhada}">
                        <div><span class="text-cyan-400">"fuso horário"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.timezoneName}"></span>"</span></div>
                        <div><span class="text-cyan-400">"longitude"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.location?.coordinates?.longitude}"></span>"</span></div>
                        <div><span class="text-cyan-400">"latitude"</span><span class="text-slate-400">: </span><span class="text-emerald-400">"<span th:text="${resultadoCep.location?.coordinates?.latitude}"></span>"</span></div>

                    </div>
                </div>
                <span class="text-slate-500">}</span>
            </div>
        </div>
    </main>
</body>
</html>
